name: TrustData CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trustdata-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12.13"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Show runtime versions
        run: python -c "import platform; print(platform.platform()); print(platform.python_version())"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Create test-results directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Run full test suite
        run: python -m pytest -q --junitxml=test-results/pytest-${{ runner.os }}.xml

      - name: Upload JUnit test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ runner.os }}-${{ github.sha }}
          path: test-results/pytest-${{ runner.os }}.xml
          if-no-files-found: error
          retention-days: 30

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to pass
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          echo "test matrix result = ${MATRIX_RESULT}"
          test "${MATRIX_RESULT}" = "success"
